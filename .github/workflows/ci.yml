name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Verifica integrita' della quirk
        run: sha256sum -c checksums.sha256

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
